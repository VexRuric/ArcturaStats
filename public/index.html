<title>ArcturaStats</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: dense stat-site shell. Header bar with tabs, one wide panel per view, tables as the main object. */
:root{
  --bg:#0e1116; --panel:#151a22; --panel2:#1b212b; --line:#2a323f; --fg:#e7eaf0; --muted:#8d97a8;
  --accent:#e0a63a; --accent-ink:#1a1305; --good:#5fbf8f; --bad:#e0676b;
  --c-assassin:#b680f2; --c-hunter:#6cc775; --c-mystic:#55aaf0; --c-priest:#efd36c; --c-warrior:#e8805f; --c-none:#8d97a8;
  --font-d:'Barlow Condensed','Arial Narrow',sans-serif; --font-b:'Barlow',system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f3f1ee; --panel:#ffffff; --panel2:#ece9e4; --line:#d6d1c9; --fg:#1c2027; --muted:#6a7280;
  --accent:#a86a00; --accent-ink:#ffffff; --good:#23885a; --bad:#bf3b40;
  --c-assassin:#8a3fd0; --c-hunter:#2e8a3a; --c-mystic:#1b78c4; --c-priest:#9a7b00; --c-warrior:#c24a26; --c-none:#6a7280; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f3f1ee; --panel:#ffffff; --panel2:#ece9e4; --line:#d6d1c9; --fg:#1c2027; --muted:#6a7280;
  --accent:#a86a00; --accent-ink:#ffffff; --good:#23885a; --bad:#bf3b40;
  --c-assassin:#8a3fd0; --c-hunter:#2e8a3a; --c-mystic:#1b78c4; --c-priest:#9a7b00; --c-warrior:#c24a26; --c-none:#6a7280; color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--font-b);padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 28px;padding:16px 20px 0;background:#0e0c0b;border-radius:6px;border-bottom:3px solid #c1121f}
header nav a{color:#b9b2a8}header nav a:hover,header nav a[aria-current=page]{color:#fff}
.brand{display:flex;align-items:flex-end;gap:12px;padding-bottom:10px}.brand img{height:46px;width:auto;display:block}.brand span{color:#e0a43a;font:700 22px/1 var(--font-d);letter-spacing:.14em;text-transform:uppercase;padding-bottom:4px}
.brand{font:700 30px/1 var(--font-d);letter-spacing:.04em;text-transform:uppercase}
.brand span{color:var(--accent)}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav a{font:600 17px/1 var(--font-d);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:10px 14px 12px;border-bottom:3px solid transparent}
nav a:hover{color:var(--fg)}
nav a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
nav a:focus-visible,button:focus-visible,th button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-top:22px;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--font-d);text-transform:uppercase;letter-spacing:.05em;margin:0}
h1{font-size:26px} h2{font-size:19px;color:var(--muted);font-weight:600}
.sub{color:var(--muted);margin:2px 0 0}
.h2h{display:grid;grid-template-columns:70px 1fr 70px;gap:10px;align-items:center}.h2h em{font-style:normal;font-variant-numeric:tabular-nums;font-weight:700}.h2h em:nth-of-type(2){text-align:right}.h2h span{grid-column:1/-1;margin:-6px 0 0;text-align:center;color:var(--muted);font-size:12px;letter-spacing:.07em;text-transform:uppercase}.hb{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}.hb i{display:block;height:100%}
.tflag{height:20px;width:auto;vertical-align:middle;margin:-3px 6px -3px -2px}.fac{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:10px 0}.fcard{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:10px 14px;background:linear-gradient(90deg,var(--fc) 0,transparent 55%) ,var(--panel);background-blend-mode:normal}.fcard img{height:96px;width:auto;flex:none}.fcard b{font:700 20px var(--font-d);letter-spacing:.04em;text-transform:uppercase}.fcard.win{outline:2px solid var(--accent)}.team{display:inline-block;color:#fff;font:600 12px var(--font-d);letter-spacing:.06em;text-transform:uppercase;border-radius:3px;padding:2px 8px}.cimg{width:96px;height:96px;border-radius:6px;object-fit:cover;border:1px solid var(--line);flex:none}.chero{display:flex;gap:16px;align-items:center}
.podium{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.pod{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;text-decoration:none;color:var(--fg)}.pod small{color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-size:12px}.pod b{font:700 24px/1.1 var(--font-d)}.pod:hover{border-color:var(--accent)}
.lbs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}.lb h3{font:600 13px var(--font-d);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}.lbr{display:grid;grid-template-columns:minmax(90px,1.2fr) 1.4fr 56px;gap:10px;align-items:center;margin-bottom:8px}.lbr .track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.lbr .track i{display:block;height:100%}.lbr em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}.lbn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rm{display:flex;gap:8px;flex-wrap:wrap}.rmc{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:8px 10px;text-decoration:none;color:var(--fg)}.rmc:hover{border-color:var(--accent)}.rmc small{color:var(--muted)}.rmc .tag{align-self:center}
.cdet{border:1px solid var(--line);border-radius:6px;margin-top:8px;padding:8px 12px}.cdet summary{cursor:pointer;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.cdet[open] summary{margin-bottom:8px}.cdet.dim{opacity:.7}.lvbar{height:8px;background:var(--line);border-radius:4px;margin:0 0 10px;overflow:hidden}.lvbar i{display:block;height:100%}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.kpis{display:flex;flex-wrap:wrap;gap:10px}
.kpi{flex:1 1 130px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px}
.kpi b{display:block;font:700 28px/1.1 var(--font-d);font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:12px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font:600 14px var(--font-d);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:0}
th button{all:unset;cursor:pointer;display:block;width:100%;padding:8px 10px;text-align:inherit;box-sizing:border-box}
th button:hover{color:var(--fg)}
th[aria-sort] button{color:var(--accent)}
tbody tr:hover{background:var(--panel2)}
tr.click{cursor:pointer}
.cls{display:inline-flex;align-items:center;gap:7px}
.dot{width:10px;height:10px;border-radius:2px;background:var(--c-none);flex:none}
.tag.ok{color:var(--good);border-color:var(--good)}.tag.err{color:var(--bad);border-color:var(--bad)}
.tag{align-self:start;justify-self:start;display:inline-block;font:600 12px var(--font-d);letter-spacing:.07em;text-transform:uppercase;border:1px solid var(--line);border-radius:3px;padding:1px 6px;color:var(--muted)}
.tag.warn{color:var(--accent);border-color:var(--accent)}
button.btn,.btn{font:600 16px var(--font-d);letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);border:0;border-radius:4px;padding:9px 16px;cursor:pointer}
button.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
button.btn:disabled{opacity:.45;cursor:default}
label.chk{display:inline-flex;gap:8px;align-items:center;color:var(--muted);cursor:pointer}
.drop{border:2px dashed var(--line);border-radius:8px;padding:34px 16px;text-align:center;color:var(--muted);background:var(--panel)}
.drop.over{border-color:var(--accent);color:var(--fg)}
.drop strong{display:block;color:var(--fg);font:600 20px var(--font-d);letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font:600 20px var(--font-d);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.err{color:var(--bad)} .ok{color:var(--good)}
.events{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.events li{display:grid;grid-template-columns:62px 74px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.events time{color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.cols{align-items:start;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
.note{color:var(--muted);font-size:13px}
a.plink{color:var(--fg);font-weight:600;text-decoration:none;border-bottom:1px dotted var(--muted)}
a.plink:hover{color:var(--accent);border-bottom-color:var(--accent)}
.comps{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.cb{display:grid;grid-template-columns:78px 1fr 52px;gap:10px;align-items:center}
.cb em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
.track{position:relative;height:8px;background:var(--panel2);border-radius:4px}
.track i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px}
.track b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg)}
.rank{color:var(--muted);width:34px}
th:nth-child(2),td:nth-child(2){text-align:left}
.meter{display:inline-block;height:6px;border-radius:3px;background:var(--accent);vertical-align:middle;margin-left:8px}
svg text{fill:var(--muted);font:12px var(--font-b)}
svg .grid{stroke:var(--line);stroke-width:1}
@media (prefers-reduced-motion:no-preference){nav a{transition:color .15s}}
#authbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-left:auto;padding-bottom:10px;position:relative}
#authbar .who{color:#e7eaf0}
#authbar>.btn.ghost{color:#e7eaf0;border-color:#5a524c}
#authbar>.plink{color:#e0a43a}
.lgpanel{position:absolute;right:0;top:100%;margin-top:6px;z-index:30;width:min(300px,86vw);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;display:grid;gap:10px;box-shadow:0 8px 24px #0008}
.lgpanel summary{cursor:pointer;color:var(--muted)}.lgpanel form{display:grid;gap:6px;margin-top:8px}.lgpanel label{color:var(--muted);font-size:13px}
.lgpanel input{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:8px;font:inherit}
.lgpanel input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

<script>
function parseCSV(text){const rows=[];let row=[],f='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(c!=='\r')f+=c}if(f!==''||row.length){row.push(f);rows.push(row)}return rows}
function hashText(s){let h1=0x811c9dc5,h2=5381;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1^=c;h1=Math.imul(h1,16777619);h2=((h2<<5)+h2+c)|0}return 'm'+(h1>>>0).toString(16)+(h2>>>0).toString(16)+s.length.toString(16)}
function parseCombatLog(text,fileName){
  const BUCKET=30,CLS=/GE_(Assassin|Hunter|Mystic|Priest|Warrior)/;
  const isMob=n=>/^(BP_|Roshan|easy mob|medium mob|hard mob)/i.test(n||'')||/_C_\d+$/.test(n||'');
  const rows=parseCSV(text.replace(/^﻿/,'')).filter(r=>r.length>3);
  if(!rows.length||rows[0][0]!=='Time')throw new Error('Not a combat log: the first column must be Time.');
  const H=rows.shift(),ix={};H.forEach((h,i)=>{if(!(h in ix))ix[h]=i});
  const P={},get=n=>isMob(n)?{tiers:{}}:P[n]||(P[n]={name:n,cls:'',dmg:0,dmgP:0,dmgM:0,dmgB:0,taken:0,heal:0,kills:0,deaths:0,mobKills:0,bossKills:0,score:0,hits:0,crits:0,maxHit:0,relicPickups:0,relicReturns:0,relicCaps:0,carrierKills:0,tiers:{Easy:0,Medium:0,Hard:0}});
  const events=[],buck={},tv={},TM={},types={},carry={};let dur=0,result=null;
  const WIN=/(?:team|side)\s*(\d+)[^.]*\b(?:wins?|won|victor)|\b(?:wins?|won|victory)\b[^.]*(?:team|side)\s*(\d+)/i;
  const tm=k=>{const o=TM[k]||(TM[k]={kills:0,points:0,relics:0,carrierKills:0});return o};
  for(const r of rows){
    const g=k=>r[ix[k]]||'',type=g('Type'),t=parseFloat(g('Time'))||0,src=g('Source'),tgt=g('Target'),msg=g('Message'),
      eff=parseFloat(g('Effective'))||0;
    if(t>dur)dur=t;
    types[type]=(types[type]||0)+1;
    const ti=g('TeamIndex')===''?-1:parseInt(g('TeamIndex'),10);
    const own=type==='PlayerKill'?(g('Killer')||src):src;
    if(ti>=0&&own&&!isMob(own)){(tv[own]||(tv[own]={}))[ti]=((tv[own]||{})[ti]||0)+1}
    if(!result){const wm=WIN.exec(msg);if(wm)result={winner:parseInt(wm[1]||wm[2],10),src:'log'};else{const fm=/(Elysiant|Ze['’]kar)[^.]*\b(?:wins?|won|victor)/i.exec(msg)||/\b(?:wins?|won|victory)\b[^.]*(Elysiant|Ze['’]kar)/i.exec(msg);if(fm)result={winner:/^e/i.test(fm[1])?0:1,src:'log'}}}
    if(type==='ControlPointCaptured'&&ti>=0)g('PlayersPresent').split(/[,;|]/).map(s=>s.trim()).filter(s=>s&&!isMob(s)).forEach(n=>{(tv[n]||(tv[n]={}))[ti]=((tv[n]||{})[ti]||0)+1})
    if(type==='DamageDealt'){
      if(src&&!isMob(src)){const p=get(src);p.dmg+=eff;p.hits++;if(g('Critical')==='1')p.crits++;if(eff>p.maxHit)p.maxHit=eff;
        if(/^Roshan/i.test(tgt))p.dmgB+=eff;else if(isMob(tgt))p.dmgM+=eff;else p.dmgP+=eff;
        const b=Math.floor(t/BUCKET);(buck[src]||(buck[src]=[]))[b]=((buck[src]||[])[b]||0)+eff}
      if(tgt&&!isMob(tgt))get(tgt).taken+=eff;
    }else if(type==='HealingDealt'){
      const cm=g('Ability').match(CLS);if(src&&cm&&!isMob(src))get(src).cls=cm[1];
      if(src&&!isMob(src)&&!/VitalsSet|RegenCalc/.test(g('Ability'))&&!/^Passive regen/.test(msg))get(src).heal+=eff;
    }else if(type==='PlayerKill'){
      const k=g('Killer')||src,vic=g('Victim')||tgt;if(k)get(k).kills++;if(ti>=0)tm(ti).kills++;
      if(vic&&carry[vic]){if(k&&!isMob(k))get(k).carrierKills++;if(ti>=0)tm(ti).carrierKills++;delete carry[vic]}events.push({t,k:'kill',x:msg})
    }else if(type==='Death'){
      if(tgt&&!isMob(tgt))get(tgt).deaths++
    }else if(type==='MobKill'){
      if(src){const p=get(src);p.mobKills++;const tr=g('MobCampTier');if(p.tiers[tr]!==undefined)p.tiers[tr]++}
    }else if(type==='BossKill'){
      if(src)get(src).bossKills++;events.push({t,k:'boss',x:msg})
    }else if(type==='ScoreAwarded'){
      if(src)get(src).score+=parseFloat(g('ScoreAwarded'))||0
    }else if(type==='RelicTaken'){
      const k=g('Killer')||src;if(k&&!isMob(k)){get(k).relicPickups++;carry[k]=t}
    }else if(type==='RelicRunOutcome'){
      const k=g('Killer');if(k)delete carry[k];if(/return/i.test(g('Target')+' '+msg)&&k&&!isMob(k)){get(k).relicReturns++}
    }else if(type==='RelicCaptured'){
      const k=g('Killer')||src;if(k&&!isMob(k)){get(k).relicCaps++;delete carry[k]}
      if(ti>=0)tm(ti).relics++;events.push({t,k:'point',x:msg||'Relic captured'})
    }else if(type==='ControlPointCaptured'){
      if(ti>=0)tm(ti).points++;
      events.push({t,k:'point',x:msg||('Control point captured by '+src)})
    }
  }
  const n=Math.floor(dur/BUCKET)+1,r1=v=>Math.round(v*10)/10,series={};
  for(const k in buck){const a=[];for(let i=0;i<n;i++)a.push(r1(buck[k][i]||0));series[k]=a}
  const players=Object.values(P).filter(p=>p.dmg||p.taken||p.heal||p.kills||p.deaths||p.mobKills||p.score||p.relicPickups||p.relicCaps).map(p=>{for(const k of ['dmg','dmgP','dmgM','dmgB','taken','heal','maxHit'])p[k]=r1(p[k]);const v=tv[p.name]||{},ks=Object.keys(v).sort((a,b)=>v[b]-v[a]);p.team=ks.length?parseInt(ks[0],10):-1;return p});
  return{v:2,teams:TM,result,types,name:fileName||'combat log',uploadedAt:Date.now(),duration:r1(dur),rows:rows.length,bucket:BUCKET,players,series,events:events.slice(0,200)};
}


(function(){

      try{u.id=hashText(txt);u.doc=parseCombatLog(txt,f.name.replace(/^[0-9a-f]{8}-/,''));

function api(method,url,body){
  return fetch(url,{method:method,credentials:'same-origin',headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined}).then(function(r){
    return r.json().catch(function(){return {}}).then(function(j){if(!r.ok){var e=new Error(j.error||'error');e.code=j.error||('http'+r.status);throw e}return j})})
}
db={collection:function(c){return {doc:function(id){return {
  set:function(d){return api('PUT','/api/doc?c='+c+'&id='+encodeURIComponent(id),d).then(function(){return refresh(true)})},
  delete:function(){return api('DELETE','/api/doc?c='+c+'&id='+encodeURIComponent(id)).then(function(){return refresh(true)})}}}}}};
function fetchDoc(kind,it){
  var key=kind+':'+it.id+':'+it.v;if(docCache[key])return Promise.resolve(docCache[key]);
  return fetch(it.url+(it.url.indexOf('?')<0?'?':'&')+'v='+it.v).then(function(r){if(!r.ok)throw new Error('doc');return r.json()}).then(function(d){docCache[key]=d;return d});
}
function refresh(force){
  return api('GET','/api/index').then(function(ix){
    me=ix.me&&ix.me.role?ix.me:null;claims=ix.claims||{};discordOn=!!ix.discord;
    var was=canEdit;canEdit=!!(me&&me.role==='admin');canWrite=canEdit;if(canEdit!==was)adminData=null;
    var sig=JSON.stringify([ix.matches.map(function(x){return x.id+x.v}),ix.snapshots.map(function(x){return x.id+x.v}),claims,me]);
    if(!force&&sig===lastSig&&loaded)return;
    return Promise.all([Promise.all(ix.matches.map(function(it){return fetchDoc('m',it).then(function(d){return [it.id,d]},function(){return null})})),Promise.all(ix.snapshots.map(function(it){return fetchDoc('s',it).then(function(d){return [it.id,d]},function(){return null})}))]).then(function(r){
      remote={};snaps={};r[0].forEach(function(p){if(p)remote[p[0]]=p[1]});r[1].forEach(function(p){if(p)snaps[p[0]]=p[1]});
      lastSig=sig;loaded=true;dbState='ok';renderAuth();render()})
  }).catch(function(){if(!loaded){dbState='off';render()}})
}
function avatarImg(u){return u&&u.avatar?'<img alt="" src="'+esc(u.avatar)+'" style="width:22px;height:22px;border-radius:50%;vertical-align:middle;margin-right:6px">':''}
var AUTHERR={not_configured:'Discord login is not set up yet.',cancelled:'Discord login was cancelled.',state:'Login expired, try again.',discord:'Discord did not accept the login, try again.'};
function renderAuth(){
  var el=document.getElementById('authbar');if(!el)return;var h='';
  if(me){
    h+='<span class="who">'+avatarImg(me)+esc(me.name)+(me.role==='admin'?' <span class="tag ok">Admin</span>':'')+'</span>';
    if(me.claim)h+='<a class="plink" href="#player-'+slug(me.claim)+'">My player</a>';
    if(me.via==='bootstrap'&&discordOn)h+='<a class="btn" href="/auth/discord?promote=1" style="text-decoration:none">Make my Discord an admin</a>';
    h+='<button class="btn ghost" type="button" data-auth="logout">Log out</button>';
  }else{
    h+='<button class="btn" type="button" data-auth="open" aria-expanded="'+loginOpen+'">Log in</button>';
    if(loginOpen){
      h+='<div class="lgpanel" role="dialog" aria-label="Log in">'+(discordOn?'<a class="btn" href="/auth/discord" style="text-decoration:none;display:block;text-align:center">Log in with Discord</a>':'<p class="note" style="margin:0">Discord login is not set up yet.</p>')+
        '<details'+(authMsg&&authMsg.indexOf('Admin')===0?' open':'')+'><summary>Admin account</summary><form id="lgForm" autocomplete="off"><label for="lgUser">Username</label><input id="lgUser" name="user" type="text" autocomplete="username" value="'+esc(lgUserVal)+'"><label for="lgPass">Password</label><input id="lgPass" name="pass" type="password" autocomplete="current-password"><button class="btn" type="submit">Log in</button></form></details>';
      if(authMsg)h+='<p class="note err" style="margin:0" role="alert">'+esc(authMsg)+'</p>';
      h+='</div>';
    }
  }
  el.innerHTML=h;
}
function claimBlock(name){
  if(isBot(name))return '';
  var c=claims[name],h='<div class="panel" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">';
  if(c){h+='<span class="tag ok">Claimed</span><span>'+avatarImg(c)+esc(c.name)+'</span>';if(canEdit)h+='<button class="btn ghost" type="button" data-aop="release:'+esc(name)+'">Release</button>'}
  else if(me&&me.via==='discord'&&me.claim){h+='<span class="note" style="margin:0">Unclaimed. Your Discord account already owns <a class="plink" href="#player-'+slug(me.claim)+'">'+esc(me.claim)+'</a>, one player per account.</span>'}
  else if(me&&me.via==='discord'){h+='<span class="note" style="margin:0">Is this you? Claim this player with your Discord account. You can claim one player.</span><button class="btn" type="button" data-claim="'+esc(name)+'">This is me</button>'}
  else{h+='<span class="note" style="margin:0">Unclaimed. '+(me?'Log in with a Discord account to claim a player.':'Log in with Discord to claim this player.')+'</span>'}
  if(claimMsg)h+='<span class="note err" role="alert" style="margin:0">'+esc(claimMsg)+'</span>';
  return h+'</div>';
}
function accountsPanel(){
  var h='<div class="panel"><h2>Accounts</h2>';
  if(!adminData)return h+'<p class="note">Loading accounts</p></div>';
  var d=adminData,hasD=d.users.some(function(u){return u.admin});
  h+='<p class="note" style="margin-top:0">People who logged in with Discord. Admins can upload and delete logs, set winners, make snapshots and manage accounts. One Discord account can claim one player.</p>';
  if(!d.users.length)h+='<p class="note">Nobody has logged in with Discord yet.</p>';
  else h+='<div class="scroll"><table><thead><tr><th scope="col">Discord</th><th scope="col">Claimed player</th><th scope="col">Role</th><th scope="col"></th></tr></thead><tbody>'+d.users.map(function(u){
    return '<tr><td>'+avatarImg(u)+esc(u.name)+'</td><td>'+(u.claim?'<a class="plink" href="#player-'+slug(u.claim)+'">'+esc(u.claim)+'</a>':'-')+'</td><td>'+(u.admin?'<span class="tag ok">Admin</span>':'<span class="tag">Player</span>')+'</td><td style="text-align:right;white-space:nowrap">'+
      (u.admin?'<button class="btn ghost" type="button" data-aop="removeAdmin:'+esc(u.id)+'">Remove admin</button>':'<button class="btn" type="button" data-aop="makeAdmin:'+esc(u.id)+'">Make admin</button>')+(u.claim?' <button class="btn ghost" type="button" data-aop="release:'+esc(u.claim)+'">Release claim</button>':'')+'</td></tr>'}).join('')+'</tbody></table></div>';
  h+='<h2 style="margin-top:18px">Bootstrap Admin account</h2>';
  if(!d.bootstrapActive)h+='<p class="note">The bootstrap Admin account has been deleted. Only Discord admins can manage the site.</p>';
  else{
    h+='<p class="note" style="margin-top:0">The username and password account. '+(me&&me.via==='bootstrap'?'Use <b>Make my Discord an admin</b> in the header to link your Discord, then delete this account.':'Delete it once a Discord admin exists. This cannot be undone.')+'</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn'+(bootArm?'':' ghost')+'" type="button" data-aop="deleteBootstrap"'+(hasD?'':' disabled')+'>'+(bootArm?'Click again to delete Admin account':'Delete Admin account')+'</button>'+(hasD?'':'<span class="note" style="margin:0;align-self:center">Make a Discord account an admin first.</span>')+'</div>';
  }
  h+='<h2 style="margin-top:18px">Bundled matches</h2><p class="note" style="margin-top:0">Imports the earlier Nov 2 and screenshot test games into the shared store. Matches already saved are skipped.</p><button class="btn ghost" type="button" data-aop="seed">Import bundled matches</button>';
  return h+'</div>';
}
function loadAdmin(){
  if(adminLoading)return;adminLoading=true;
  api('GET','/api/admin').then(function(d){adminData=d;adminLoading=false;render()},function(){adminLoading=false});
}
var ERR={taken:'That player is already claimed.',you_already_claimed:'Your Discord account already owns a player.',unknown_player:'That player is not in any saved match.',login_with_discord:'Log in with Discord first.',last_admin:'That is the last admin. Make another admin first.',make_a_discord_admin_first:'Make a Discord account an admin first.',bad_login:'Admin login failed.',too_many_attempts:'Too many attempts. Wait ten minutes.'};
document.addEventListener('click',function(e){
  var a=e.target.closest('[data-auth]');
  if(a){var k=a.dataset.auth;if(k==='open'){loginOpen=!loginOpen;authMsg='';renderAuth();var u=document.getElementById('lgUser');if(loginOpen&&u)u.focus()}
    if(k==='logout')api('POST','/api/auth?a=logout').then(function(){me=null;canEdit=false;canWrite=false;adminData=null;lastSig='';renderAuth();return refresh(true)});return}
  var cl=e.target.closest('[data-claim]');
  if(cl){claimMsg='';api('POST','/api/claim',{player:cl.dataset.claim}).then(function(){return refresh(true)},function(err){claimMsg=ERR[err.code]||'Could not claim.';render()});return}
  var op=e.target.closest('[data-aop]');
  if(op){
    var raw=op.dataset.aop,i=raw.indexOf(':'),name=i<0?raw:raw.slice(0,i),arg=i<0?'':raw.slice(i+1);
    if(name==='deleteBootstrap'){if(!bootArm){bootArm=true;render();return}bootArm=false}
    else if(bootArm){bootArm=false}
    if(name==='seed'){
      fetch('/seed/manifest.json').then(function(r){return r.json()}).then(function(list){
        return list.reduce(function(p,it){return p.then(function(){if(remote[it.id])return;return fetch('/seed/'+it.file).then(function(r){return r.json()}).then(function(d){return api('PUT','/api/doc?c=matches&id='+encodeURIComponent(it.id),d)})})},Promise.resolve())}).then(function(){return refresh(true)}).catch(function(){claimMsg='Import failed.';render()});return}
    var body=name==='release'?{op:'release',player:arg}:name==='deleteBootstrap'?{op:'deleteBootstrap'}:{op:name,id:arg};
    api('POST','/api/admin',body).then(function(){adminData=null;if(name==='deleteBootstrap'){me=null;canEdit=false;canWrite=false;lastSig=''}return refresh(true)}).then(function(){if(canEdit)loadAdmin()},function(err){authMsg=ERR[err.code]||'Action failed.';claimMsg=authMsg;render()});
  }
});
document.addEventListener('submit',function(e){
  if(e.target.id!=='lgForm')return;e.preventDefault();
  var u=document.getElementById('lgUser').value;lgUserVal=u;var p=document.getElementById('lgPass').value;
  api('POST','/api/auth?a=login',{user:u,pass:p}).then(function(){loginOpen=false;authMsg='';lastSig='';return refresh(true)}).then(function(){renderAuth()},function(err){authMsg='Admin: '+(ERR[err.code]||'Login failed.');renderAuth()});
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&loginOpen){loginOpen=false;renderAuth()}});
render();renderAuth();
(function(){var q=new URLSearchParams(location.search);if(q.get('authError')){authMsg=AUTHERR[q.get('authError')]||'Login failed.';loginOpen=true;history.replaceState(null,'',location.pathname+location.hash)}})();
refresh(true).then(function(){renderAuth()});
setInterval(function(){if(document.visibilityState==='visible')refresh(false)},30000);

})();
</script>

</html>
