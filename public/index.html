<title>ArcturaStats</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: dense stat-site shell. Header bar with tabs, one wide panel per view, tables as the main object. */
:root{
  --bg:#0e1116; --panel:#151a22; --panel2:#1b212b; --line:#2a323f; --fg:#e7eaf0; --muted:#8d97a8;
  --accent:#e0a63a; --accent-ink:#1a1305; --good:#5fbf8f; --bad:#e0676b;
  --c-assassin:#b680f2; --c-hunter:#6cc775; --c-mystic:#55aaf0; --c-priest:#efd36c; --c-warrior:#e8805f; --c-none:#8d97a8;
  --font-d:'Barlow Condensed','Arial Narrow',sans-serif; --font-b:'Barlow',system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f3f1ee; --panel:#ffffff; --panel2:#ece9e4; --line:#d6d1c9; --fg:#1c2027; --muted:#6a7280;
  --accent:#a86a00; --accent-ink:#ffffff; --good:#23885a; --bad:#bf3b40;
  --c-assassin:#8a3fd0; --c-hunter:#2e8a3a; --c-mystic:#1b78c4; --c-priest:#9a7b00; --c-warrior:#c24a26; --c-none:#6a7280; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f3f1ee; --panel:#ffffff; --panel2:#ece9e4; --line:#d6d1c9; --fg:#1c2027; --muted:#6a7280;
  --accent:#a86a00; --accent-ink:#ffffff; --good:#23885a; --bad:#bf3b40;
  --c-assassin:#8a3fd0; --c-hunter:#2e8a3a; --c-mystic:#1b78c4; --c-priest:#9a7b00; --c-warrior:#c24a26; --c-none:#6a7280; color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--font-b);padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto}
/* winner banners flank the page in the side margins, only when a window is wide enough to hold them beside the 1100px content */
.sbn{display:none;position:fixed;top:150px;z-index:0;pointer-events:none}.sbn img{display:block;height:min(46vh,380px);width:auto;filter:drop-shadow(0 10px 26px rgba(0,0,0,.65))}
.sbn.l{right:calc(50% + 550px + 30px)}.sbn.r{left:calc(50% + 550px + 30px)}
@media (min-width:1500px){.sbn{display:block}}
@media print{.sbn{display:none}}
header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 28px;padding:16px 20px 0;background:#0e0c0b;border-radius:6px;border-bottom:3px solid #c1121f}
header nav a{color:#b9b2a8}header nav a:hover,header nav a[aria-current=page]{color:#fff}
.brand{display:flex;align-items:flex-end;gap:12px;padding-bottom:10px}.brand img{height:46px;width:auto;display:block}.brand span{color:#e0a43a;font:700 22px/1 var(--font-d);letter-spacing:.14em;text-transform:uppercase;padding-bottom:4px}
.brand{font:700 30px/1 var(--font-d);letter-spacing:.04em;text-transform:uppercase}
.brand span{color:var(--accent)}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav a{font:600 17px/1 var(--font-d);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:10px 14px 12px;border-bottom:3px solid transparent}
nav a:hover{color:var(--fg)}
nav a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
nav a:focus-visible,button:focus-visible,th button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-top:22px;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--font-d);text-transform:uppercase;letter-spacing:.05em;margin:0}
h1{font-size:26px} h2{font-size:19px;color:var(--muted);font-weight:600}
.sub{color:var(--muted);margin:2px 0 0}

<script>
function parseCSV(text){const rows=[];let row=[],f='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(c!=='\r')f+=c}if(f!==''||row.length){row.push(f);rows.push(row)}return rows}
function hashText(s){let h1=0x811c9dc5,h2=5381;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1^=c;h1=Math.imul(h1,16777619);h2=((h2<<5)+h2+c)|0}return 'm'+(h1>>>0).toString(16)+(h2>>>0).toString(16)+s.length.toString(16)}
var CP_WORLD={North:[0,-150],South:[0,150],West:[-150,0],East:[150,0]};
function posC(a){return (a||[]).map(function(q){return [Math.round(q[0]),Math.round(q[1]),Math.round(q[2]),q[3]?1:0]})}
function parseMatchLedger(text,fileName){
  var L;if(text&&typeof text==='object')L=text;else try{L=JSON.parse(text.replace(/^﻿/,''))}catch(e){throw new Error('Not a match ledger: invalid JSON.')}
  if(!L||!Array.isArray(L.players)||L.teamPoints==null)throw new Error('Not a match ledger: no players or teamPoints.');
  var BUCKET=30,r1=function(v){return Math.round((+v||0)*10)/10},TM={},tm=function(k){return TM[k]||(TM[k]={kills:0,points:0,relics:0,carrierKills:0})};
  var byId={};L.players.forEach(function(p){byId[p.id]=p});
  var ENVK='Mob or environment',skl=function(x){x=String(x||'').replace(/^Aeon\.Ability\./,'');return x==='None'?'':x};
  var dur=+L.durationSec||+L.durationSeconds||0;
  Object.keys(L.teamPoints).forEach(function(k){tm(+k).points=+L.teamPoints[k]||0});
  var ev=[],tiers={},bossK={};
  (L.kills||[]).forEach(function(k){var a=byId[k.killer],v=byId[k.victim];if(a&&!k.selfKill)tm(a.team).kills++;
    ev.push({t:r1(k.t),k:'kill',x:(a?a.name:ENVK)+' killed '+(v?v.name:'?')+(skl(k.skill)?' with '+skl(k.skill):'')})});
  (L.mobKills||[]).forEach(function(m){var t=tiers[m.killer]||(tiers[m.killer]={Easy:0,Medium:0,Hard:0});if(t[m.tier]!==undefined)t[m.tier]++});
  (L.bossKills||[]).forEach(function(b){bossK[b.killer]=(bossK[b.killer]||0)+1;var a=byId[b.killer];ev.push({t:r1(b.t),k:'boss',x:(a?a.name:'?')+' killed '+String(b.boss||'boss').replace(/_C$/,'')})});
  var carriers={};
  (L.relicEvents||[]).forEach(function(e){var a=byId[e.player];
    if(e.type==='captured'){if(e.scoringTeam>=0)tm(e.scoringTeam).relics++;ev.push({t:r1(e.t),k:'point',x:(a?a.name:'?')+' captured the relic'})}});
  (L.controlPointEvents||[]).forEach(function(e){if(e.type==='capture'){var n=(e.players||[]).map(function(i){return byId[i]&&byId[i].name}).filter(Boolean).join(', ');ev.push({t:r1(e.t),k:'point',x:(e.controlPoint||'Control point')+' captured'+(n?' by '+n:'')})}});
  ev.sort(function(a,b){return a.t-b.t});
  var scoreTl=[],lastTl=-99,rawTl=L.teamScoreTimeline||[];rawTl.forEach(function(e,i){if(e[0]-lastTl>=10||i===rawTl.length-1){scoreTl.push([Math.round(e[0]),e[1],e[2]]);lastTl=e[0]}});
  var posOf={};L.players.forEach(function(p){posOf[p.id]=p.positions||[]});
  function at(id,t,alive){var a=posOf[id]||[],b=null;for(var i=0;i<a.length;i++){if(a[i][0]<=t){if(!alive||a[i][3])b=a[i]}else break}return b||(alive?null:a[0])||null}
  var log=[],cpTl=[];
  function nm(i){return byId[i]?byId[i].name:'?'}
  function nmk(i){return byId[i]?byId[i].name:(i===-1?ENVK:'?')}
  function tmOf(i){return byId[i]?byId[i].team:-1}
  function lg(e,q){if(q){e.x=Math.round(q[1]);e.y=Math.round(q[2])}e.t=r1(e.t);if(e.x!=null)log.push(e)}
  (L.kills||[]).forEach(function(k){var q=at(k.victim,k.t,true)||at(k.victim,k.t,false);
    lg({t:k.t,k:'kill',a:nmk(k.killer),b:nm(k.victim),team:tmOf(k.killer),sk:skl(k.skill)},q);
    lg({t:k.t,k:'death',a:nmk(k.killer),b:nm(k.victim),team:tmOf(k.victim)},q)});
  (L.mobKills||[]).forEach(function(m){lg({t:m.t,k:'mob',a:nm(m.killer),team:tmOf(m.killer),tier:m.tier},at(m.killer,m.t,false))});
  (L.bossKills||[]).forEach(function(b){lg({t:b.t,k:'boss',a:nm(b.killer),team:tmOf(b.killer)},at(b.killer,b.t,false))});

/* ---- skill model ----
   Rating 100 = the reference performance below. Per match, default weights: damage/min 35%, score/min 25%, kills/min 20%, survival 20%.
   Warrior swaps in a tank component (below) and lighter damage and kill targets: damage 25%, score 25%, kills 15%, survival 15%, tanking 20%.
   Tanking = (damage taken + damage absorbed or blocked) per minute against the class reference, scaled by how well the player stayed alive,
   so soaking damage only counts while surviving it, and it is capped at 2 so standing in front of mobs cannot carry a rating.
   Survival is 1.5 with no deaths, 1.0 at the reference death rate, 0 at three times the reference.
   Priest swaps in a healing component: damage 20%, score 20%, kills 10%, survival 20%, healing 30% (heal/min against 800, capped at 2).
   The rating line is an exponential moving average of match ratings (alpha 0.35), so it moves with form. */
var REF={dpm:2000,spm:70,kpm:0.5,dth:0.1,tpm:600,w:{dmg:0.35,score:0.25,kills:0.2,surv:0.2,tank:0,heal:0},hpm:800},REF_CLASS={Assassin:{},Hunter:{},Mystic:{},Priest:{dpm:1200,w:{dmg:0.2,score:0.2,kills:0.1,surv:0.2,heal:0.3}},Warrior:{dpm:1400,spm:60,kpm:0.4,dth:0.12,tpm:600,w:{dmg:0.25,score:0.25,kills:0.15,surv:0.15,tank:0.2,heal:0}}},ALPHA=0.35,PROVISIONAL=5;
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function refFor(c){var o=Object.assign({},REF,REF_CLASS[c]||{});o.w=Object.assign({},REF.w,(REF_CLASS[c]||{}).w||{});return o}
function perf(p,d){
  var mins=Math.max((d.duration||0)/60,1),R=refFor(p.cls);
  var comp={dmg:clamp(p.dmg/mins/R.dpm,0,2),score:clamp(p.score/mins/R.spm,0,2),kills:clamp(p.kills/mins/R.kpm,0,2),surv:clamp(1.5-0.5*((p.deaths/mins)/R.dth),0,1.5)};
  var W=R.w;comp.heal=clamp((p.heal||0)/mins/R.hpm,0,2);comp.tank=clamp(((p.taken||0)+(p.absorbed||0))/mins/R.tpm,0,2)*clamp(comp.surv/1.5,0,1);

function aggregate(){
  var map={};
  allMatches().forEach(function(m){
    var d=m.doc;if(ratedOnly&&isPractice(d))return;(d.players||[]).forEach(function(p){
      if(hideBots&&isBot(p.name))return;
      var a=map[p.name]||(map[p.name]={name:p.name,cls:{},matches:0,mins:0,dmg:0,dmgP:0,dmgM:0,dmgB:0,taken:0,heal:0,kills:0,deaths:0,mobKills:0,bossKills:0,score:0,hits:0,crits:0,maxHit:0});

      ['dmg','dmgP','dmgM','dmgB','taken','heal','kills','deaths','mobKills','bossKills','score','hits','crits'].forEach(function(k){a[k]+=p[k]||0});
      if(p.maxHit>a.maxHit)a.maxHit=p.maxHit;
      if(p.cls)a.cls[p.cls]=(a.cls[p.cls]||0)+1;
    })});

    a.main=Object.keys(a.cls).sort(function(x,y){return a.cls[y]-a.cls[x]})[0]||'';

  ok.sort(function(a,b){return b.score-a.score});out=out.concat(ok.slice(0,3));

      byT[tt].forEach(function(q){if(!q.a||Math.hypot(q.x-e.x,q.y-e.y)>R)return;if(q.t===e.team)a++;else b++});A+=a;B+=b;bA=a;bB=b}

      g.forEach(function(a){if(a===me||!a.a||Math.hypot(a.x-me.x,a.y-me.y)>ANA.chase)return;var s=r.players[a.n];if(!s)return;
        if(a.t!==c0.team){s.chase+=step;chasers[a.n]=1;chaseSec+=step;bySec[a.n]=(bySec[a.n]||0)+step}else s.escort+=step})});

function anaEventRows(ms){

  if(lo<0)s+='<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+Y(0).toFixed(1)+'" y2="'+Y(0).toFixed(1)+'" stroke="var(--muted)"/>';

/* binned values to points: cumulative runs up, otherwise one point per bin */

  var cf=e.target.closest('[data-confirm]');if(cf){var k=cf.dataset.confirm;if(confirmKey===k){if(k.indexOf('e:')===0)evDelete(k.slice(2));else delMatches(k.indexOf('m:')===0?[k.slice(2)]:bulkIds(k))}else{confirmKey=k;render()}return}
  if(confirmKey){confirmKey='';render()}
  var da=e.target.closest('[data-delall]');if(da){var on2=da.dataset.delall==='1';allMatches().forEach(function(m){if(m.saved)delSel[m.id]=on2});render();return}
  var dd=e.target.closest('[data-discard]');if(dd){var ui=+dd.dataset.discard,u=uploads[ui];if(u&&u.id&&local[u.id])delete local[u.id];uploads.splice(ui,1);render();return}
  if(e.target.closest('[data-discardall]')){uploads.forEach(function(u){if(u.id&&local[u.id])delete local[u.id]});uploads=[];render();return}

document.addEventListener('keydown',function(e){if(e.key==='Enter'){var g=e.target.closest&&e.target.closest('tr[data-go]');if(g)location.hash=g.dataset.go}});

function handleFiles(list){
  Array.prototype.slice.call(list).forEach(function(f){
    var u={name:f.name};uploads.unshift(u);
    f.text().then(function(txt){
      u.raw=txt;
      try{u.id=hashText(txt);u.doc=parseAnyLog(txt,f.name.replace(/^[0-9a-f]{8}-/,''));
        if(remote[u.id])u.dup=true;else local[u.id]=u.doc}catch(err){u.err=err.message}
      render()},function(){u.err='Could not read the file.';render()});
  });render();

var exportPos=true;
function dlJson(name,obj){var t=typeof obj==='string'?obj:JSON.stringify(obj),b=new Blob([t],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},600)}
function expDoc(d){if(exportPos)return d;var o=Object.assign({},d);o.players=(d.players||[]).map(function(p){var q=Object.assign({},p);delete q.pos;delete q.pb;return q});return o}
function exportMatches(list,label,extra){
  var c=document.getElementById('expPos');if(c)exportPos=c.checked;
  if(!list.length)return;
  var b=Object.assign({app:'ArcturaStats',format:1,exportedAt:new Date().toISOString(),positions:exportPos,count:list.length},extra||{});
  b.matches=list.map(function(m){return {id:m.id,name:m.doc.name,playedAt:playedAt(m.doc),doc:expDoc(m.doc)}});
  dlJson('arcturastats-'+label+'-'+new Date().toISOString().slice(0,10)+'.json',b);
}
function save(i){
  var u=uploads[i];if(!u||!u.doc||!db)return;
  db.collection('matches').doc(u.id).set(u.doc).then(function(){u.saved=true;delete local[u.id];render();saveRaw(u)},function(err){u.err='Save failed: '+(err&&err.code||'error');render()});
}
/* the uploaded ledger, kept untouched in a separate admin-only store so nothing the importer skips is ever lost */
function saveRaw(u){
  if(!u.doc||!u.doc.ledger||!u.raw||u.rawSaved)return;
  if(u.raw.length>4000000){u.rawNote='Raw ledger is over 4 MB, not kept.';render();return}
  var led;try{led=JSON.parse(u.raw.replace(/^\ufeff/,''))}catch(x){return}
  api('PUT','/api/doc?c=raw&id='+encodeURIComponent(u.id),{fileName:u.name,savedAt:Date.now(),ledger:led}).then(function(){u.rawSaved=true;render()},function(err){u.rawNote='Raw ledger not kept: '+(err&&err.code||'error');render()});
}
/* rebuild a stored match from its kept raw ledger with the current importer */
function rebuildMatch(id){
  var m=allMatches().filter(function(x){return x.id===id})[0];if(!m||!db)return;
  rebuildMsg='Rebuilding...';render();
  api('GET','/api/doc?c=raw&id='+encodeURIComponent(id)).then(function(r){
    var d=parseMatchLedger(JSON.stringify(r.ledger),(m.doc.name||r.fileName||'match ledger'));
    d.uploadedAt=m.doc.uploadedAt||d.uploadedAt;
    if(m.doc.result&&m.doc.result.src!=='log')d.result=m.doc.result;
    return db.collection('matches').doc(id).set(d).then(function(){rebuildMsg='Rebuilt from the raw ledger.';render()});
  }).catch(function(err){rebuildMsg=err&&err.code==='not_found'?'No raw ledger was kept for this match. It was saved before raw ledgers were kept; re-upload the original file.':'Could not rebuild: '+(err&&err.code||'error');render()});
}
var rebuildMsg='';
function rebuildAll(){
  var ms=allMatches().filter(function(m){return m.saved&&m.doc.ledger});if(!ms.length||!db)return;
  var i=0,ok=0,miss=0,fail=0;rebuildMsg='Rebuilding '+ms.length+' matches...';render();
  (function next(){
    if(i>=ms.length){rebuildMsg='Rebuilt '+ok+' of '+ms.length+' from their raw ledgers'+(miss?'. '+miss+' had no raw ledger kept, re-upload those':'')+(fail?'. '+fail+' failed':'')+'.';render();return}
    var m=ms[i++];
    api('GET','/api/doc?c=raw&id='+encodeURIComponent(m.id)).then(function(r){
      var d=parseMatchLedger(JSON.stringify(r.ledger),(m.doc.name||r.fileName||'match ledger'));
      d.uploadedAt=m.doc.uploadedAt||d.uploadedAt;if(m.doc.result&&m.doc.result.src!=='log')d.result=m.doc.result;
      return db.collection('matches').doc(m.id).set(d).then(function(){ok++})
    }).catch(function(err){if(err&&err.code==='not_found')miss++;else fail++}).then(next)
  })();
}
function remove(id){db&&db.collection('matches').doc(id).delete().then(function(){location.hash='matches'},function(){})}

/* ---- hosted storage and accounts ---- */
var me=null,claims={},adminData=null,adminLoading=false,loginOpen=false,authMsg='',docCache={},lastSig='',discordOn=true,claimMsg='',pubIds={};
function api(method,url,body){
  return fetch(url,{method:method,credentials:'same-origin',headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined}).then(function(r){
    return r.json().catch(function(){return {}}).then(function(j){if(!r.ok){var e=new Error(j.error||'error');e.code=j.error||('http'+r.status);throw e}return j})})
}
db={collection:function(c){return {doc:function(id){return {
  set:function(d){return api('PUT','/api/doc?c='+c+'&id='+encodeURIComponent(id),d).then(function(){return refresh(true)})},
  delete:function(){return api('DELETE','/api/doc?c='+c+'&id='+encodeURIComponent(id)).then(function(){return refresh(true)})}}}}}};
function fetchDoc(kind,it){
  var key=kind+':'+it.id+':'+it.v;if(docCache[key])return Promise.resolve(docCache[key]);
  return fetch(it.url+(it.url.indexOf('?')<0?'?':'&')+'v='+it.v).then(function(r){if(!r.ok)throw new Error('doc');return r.json()}).then(function(d){docCache[key]=d;return d});
}
function refresh(force){
  return api('GET','/api/index').then(function(ix){
    me=ix.me&&ix.me.role?ix.me:null;claims=ix.claims||{};pubIds={};(ix.pub||[]).forEach(function(k){pubIds[k]=true});discordOn=!!ix.discord;
    var was=canEdit+'|'+canDesign;canEdit=!!(me&&me.role==='admin');canDesign=!!(me&&(me.role==='admin'||me.role==='designer'));canWrite=canEdit;if(canEdit+'|'+canDesign!==was)adminData=null;
    var sig=JSON.stringify([ix.matches.map(function(x){return x.id+x.v}),ix.snapshots.map(function(x){return x.id+x.v}),claims,me,ix.pub]);
    if(!force&&sig===lastSig&&loaded)return;
    return Promise.all([Promise.all(ix.matches.map(function(it){return fetchDoc('m',it).then(function(d){return [it.id,d]},function(){return null})})),Promise.all(ix.snapshots.map(function(it){return fetchDoc('s',it).then(function(d){return [it.id,d]},function(){return null})}))]).then(function(r){
      remote={};snaps={};r[0].forEach(function(p){if(p)remote[p[0]]=p[1]});r[1].forEach(function(p){if(p)snaps[p[0]]=p[1]});
      lastSig=sig;loaded=true;dbState='ok';renderAuth();render()})
  }).catch(function(){if(!loaded){dbState='off';render()}})
}
function pubTag(id){return canEdit?(pubIds[id]?'<span class="tag ok">Public</span>':'<span class="tag">Private</span>'):''}
function pubBtn(id){return canEdit?(pubIds[id]?'<button class="btn ghost" type="button" data-aop="unpublish:'+esc(id)+'">Unpublish</button>':'<button class="btn" type="button" data-aop="publish:'+esc(id)+'">Publish</button>'):''}
function evDate(s){var t=0;(s.matchIds||[]).forEach(function(k){var m=allMatches().filter(function(x){return x.id===k})[0];if(m){var p=playedAt(m.doc);if(p>t)t=p}});return t||s.createdAt||0}
function eventCard(id,s){
  var ms=(s.matchIds||[]).map(function(k){return allMatches().filter(function(m){return m.id===k})[0]}).filter(Boolean).sort(function(a,b){return playedAt(b.doc)-playedAt(a.doc)});
  var F={0:{w:0,l:0},1:{w:0,l:0}},P={},any=false;
  ms.forEach(function(m){var d=m.doc;[0,1].forEach(function(f){var o=outcome(d,f);if(o==='win'){F[f].w++;any=true}else if(o==='loss')F[f].l++});
    (d.players||[]).forEach(function(p){if(isBot(p.name))return;var a=P[p.name]||(P[p.name]={name:p.name,score:0,k:0,d:0,g:0});a.score+=p.score||0;a.k+=p.kills||0;a.d+=p.deaths||0;a.g++})});
  var pr=Object.keys(P).map(function(k){return P[k]}).sort(function(a,b){return b.score-a.score});

  var h='<details class="cdet"><summary><strong>'+esc(s.name)+'</strong> <span class="note" style="margin:0">'+esc(when)+'</span> <span class="tag">'+ms.length+' match'+(ms.length===1?'':'es')+'</span> <span class="tag">'+pr.length+' player'+(pr.length===1?'':'s')+'</span>'+(any?' <span class="note" style="margin:0">'+esc(teamName(0))+' '+F[0].w+' - '+F[1].w+' '+esc(teamName(1))+'</span>':'')+' '+pubTag(id)+'</summary>';
  h+='<div style="padding:8px 0">';

  else{
    h+='<div class="kpis"><div class="kpi"><b>'+ms.length+'</b><small>Matches</small></div><div class="kpi"><b>'+pr.length+'</b><small>Players</small></div><div class="kpi"><b>'+num(ms.reduce(function(t,m){return t+(m.doc.duration||0)},0)/60,0)+' min</b><small>Total match time</small></div><div class="kpi"><b>'+(pr[0]?esc(pr[0].name):'-')+'</b><small>Most points'+(pr[0]?' ('+num(pr[0].score)+')':'')+'</small></div></div>';
    h+='<div class="cols"><div class="panel"><h2>Top players</h2><div class="scroll"><table><thead><tr><th scope="col"><button type="button" disabled>Player</button></th><th scope="col"><button type="button" disabled>Games</button></th><th scope="col"><button type="button" disabled>Pts</button></th><th scope="col"><button type="button" disabled>K/D</button></th></tr></thead><tbody>'+pr.slice(0,5).map(function(p){return '<tr><td><a class="plink" href="#player-'+slug(p.name)+'">'+esc(p.name)+'</a></td><td>'+p.g+'</td><td>'+num(p.score)+'</td><td>'+num(p.d?p.k/p.d:p.k,2)+'</td></tr>'}).join('')+'</tbody></table></div></div>';
    h+='<div class="panel"><h2>Matches, newest first</h2><ul class="events">'+ms.map(function(m){var d=m.doc;return '<li><time>'+esc(new Date(playedAt(d)).toLocaleDateString(undefined,{month:'short',day:'numeric'}))+'</time><span><a class="plink" href="#match-'+esc(m.id)+'">'+esc(mtitle(d))+'</a></span> '+resultTag(d)+' <span class="note" style="margin:0">'+dur(d.duration||0)+'</span></li>'}).join('')+'</ul></div></div>';
  }
  h+='<p style="margin:10px 0 0"><a class="btn" style="text-decoration:none" href="#event-'+esc(id)+'">Open full event page</a>'+(canEdit?' '+pubBtn(id):'')+'</p></div></details>';
  return h;
}
function viewSnapshots(){
  var list=Object.keys(snaps).map(function(k){return {id:k,s:snaps[k]}}).sort(function(a,b){return evDate(b.s)-evDate(a.s)||(b.s.createdAt||0)-(a.s.createdAt||0)});

function avatarImg(u){return u&&u.avatar?'<img alt="" src="'+esc(u.avatar)+'" style="width:22px;height:22px;border-radius:50%;vertical-align:middle;margin-right:6px">':''}
var AUTHERR={not_configured:'Discord login is not set up yet.',cancelled:'Discord login was cancelled.',state:'Login expired, try again.',discord:'Discord did not accept the login, try again.'};
function renderAuth(){
  var el=document.getElementById('authbar');if(!el)return;var h='';
  if(me){
    h+='<span class="who">'+avatarImg(me)+esc(me.name)+(me.role==='admin'?' <span class="tag ok">Admin</span>':me.role==='designer'?' <span class="tag ok">Designer</span>':'')+'</span>';
